name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Test
        run: make test

      - name: Build HexTiller
        run: make all

      - name: Archive Linux artifact
        run: tar -czf dist/hextiller-linux-amd64.tar.gz -C dist hextiller-linux-amd64

      - name: Archive Windows artifact
        run: cd dist && zip hextiller-windows-amd64.zip hextiller-windows-amd64.exe

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          commit: main
          name: Release ${{ github.ref_name }}
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: dist/hextiller-linux-amd64.tar.gz,dist/hextiller-windows-amd64.zip
